# /etc/nginx/sites-available/default
#
# 블루-그린 배포를 위해 upstream 블록을 추가하고,
# proxy_pass를 http://togedy-backend 로 변경한 설정입니다.
# deploy.sh 가 /etc/nginx/conf.d/togedy-upstream.conf 를 교체하며 트래픽을 전환합니다.

upstream togedy-backend {
    include /etc/nginx/togedy-upstream.conf;
}

server {
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name togedy.site www.togedy.site;

    location / {
        proxy_pass         http://togedy-backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/togedy.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/togedy.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.togedy.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = togedy.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name togedy.site www.togedy.site;
    return 404; # managed by Certbot
}
