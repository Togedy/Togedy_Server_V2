spring:
  datasource:
    url: ${PROD_MYSQL_HOST}
    username: ${PROD_MYSQL_USER}
    password: ${PROD_MYSQL_PASSWORD}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    mongodb:
      uri: ${PROD_MONGODB_URI}

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: ${PROD_S3_ACCESS_KEY}
        secret-key: ${PROD_S3_SECRET_KEY}
      s3:
        bucket: ${PROD_S3_BUCKET_NAME}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  level:
    root: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

swagger:
  server:
    url: ${PROD_SWAGGER_URL}

kakao:
  admin-key: ${PROD_KAKAO_ADMIN_KEY}

jwt:
  secret-key: ${PROD_JWT_SECRET_KEY}
  access-expired-in: 3600000        # 1시간
  refresh-expired-in: 2592000000   # 30일

cors:
  allowed-origins: https://togedy.site,https://www.togedy.site