<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('앱 공지사항')}"></head>
<body>
<nav th:replace="~{admin/fragments :: nav}"></nav>
<h1>앱 공지사항</h1>
<p><a th:href="@{/admin/notices/new}">새 공지 작성</a></p>
<table>
    <thead>
    <tr><th>ID</th><th>제목</th><th>등록일</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(notices)}"><td colspan="4">등록된 공지사항이 없습니다.</td></tr>
    <tr th:each="notice : ${notices}">
        <td th:text="${notice.noticeId}"></td>
        <td th:text="${notice.noticeTitle}"></td>
        <td th:text="${notice.publishedAt}"></td>
        <td class="actions">
            <a th:href="@{/admin/notices/{id}/edit(id=${notice.noticeId})}">수정</a>
            <form class="inline" th:action="@{/admin/notices/{id}/delete(id=${notice.noticeId})}" method="post"
                  onsubmit="return confirm('삭제하시겠습니까?');">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
