<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${holidayId} == null ? '연휴 등록' : '연휴 수정')}"></head>
<body>
<header th:replace="~{admin/fragments :: nav('holiday')}"></header>
<main>
    <div class="page-head">
        <h1 th:text="${holidayId} == null ? '연휴 등록' : '연휴 수정'"></h1>
    </div>
    <form class="card pad" th:object="${form}" method="post"
          th:action="${holidayId} == null ? @{/admin/holidays} : @{/admin/holidays/{id}/edit(id=${holidayId})}">
        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
        <div class="field">
            <label for="name">연휴명</label>
            <input type="text" th:field="*{name}" th:errorclass="invalid" placeholder="예) 2026 추석 연휴">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="field">
            <label for="startDate">시작일</label>
            <input type="date" th:field="*{startDate}" th:errorclass="invalid">
            <span class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></span>
        </div>
        <div class="field">
            <label for="endDate">종료일</label>
            <input type="date" th:field="*{endDate}" th:errorclass="invalid">
            <span class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></span>
        </div>
        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/admin/holidays}">목록</a>
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
</main>
</body>
</html>
