<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Togedy Admin'">Togedy Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --green: #11BC78;
            --green-bg: #EEFAF6;
            --gray-50: #F8F8FA;
            --gray-100: #F2F3F5;
            --gray-200: #EBEDF0;
            --gray-300: #D5D9DF;
            --gray-400: #C4C8CC;
            --gray-500: #A8AEB4;
            --gray-600: #5F6773;
            --gray-700: #49505C;
            --gray-800: #393E47;
            --gray-900: #000000;
            --red: #F04452;
            --red-bg: #FDEEEF;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px; font-weight: 500; line-height: 1.6;
            color: var(--gray-700); background: var(--gray-50);
        }
        a { color: inherit; text-decoration: none; }

        .header { background: #fff; border-bottom: 1px solid var(--gray-200); }
        .header-inner {
            max-width: 1080px; margin: 0 auto; padding: 0 24px; height: 60px;
            display: flex; align-items: center; gap: 28px;
        }
        .brand { font-size: 18px; font-weight: 700; color: var(--gray-900); }
        .brand span { color: var(--green); }
        .menu { display: flex; gap: 4px; flex: 1; }
        .menu a { padding: 6px 12px; border-radius: 8px; color: var(--gray-600); }
        .menu a:hover { background: var(--gray-100); }
        .menu a.active { color: var(--green); background: var(--green-bg); font-weight: 600; }
        .account { display: flex; align-items: center; gap: 12px; color: var(--gray-500); font-size: 13px; }

        main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
        .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--gray-900); }
        .desc { margin: 4px 0 0; color: var(--gray-500); font-size: 13px; }

        .card { background: #fff; border: 1px solid var(--gray-200); border-radius: 12px; overflow: hidden; }
        .card.pad { padding: 24px; }

        table { width: 100%; border-collapse: collapse; }
        th {
            padding: 12px 16px; text-align: left; white-space: nowrap;
            font-size: 13px; font-weight: 600; color: var(--gray-600);
            background: var(--gray-50); border-bottom: 1px solid var(--gray-200);
        }
        td { padding: 14px 16px; border-bottom: 1px solid var(--gray-200); vertical-align: top; color: var(--gray-800); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: var(--gray-50); }
        td.empty { text-align: center; color: var(--gray-500); padding: 48px 16px; }
        td.muted, .muted { color: var(--gray-500); font-size: 13px; white-space: nowrap; }
        .content { white-space: pre-wrap; word-break: break-all; }

        .meta { display: grid; grid-template-columns: 120px 1fr; gap: 10px 16px; margin: 0 0 20px; }
        .meta dt { color: var(--gray-500); font-size: 13px; }
        .meta dd { margin: 0; color: var(--gray-800); }
        .body {
            padding-top: 20px; border-top: 1px solid var(--gray-200);
            min-height: 160px; color: var(--gray-800);
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            height: 36px; padding: 0 16px; border: 1px solid transparent; border-radius: 8px;
            font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-primary { background: var(--green); color: #fff; }
        .btn-primary:hover { filter: brightness(0.95); }
        .btn-secondary { background: var(--gray-100); color: var(--gray-800); }
        .btn-secondary:hover { background: var(--gray-200); }
        .btn-outline { background: #fff; color: var(--gray-600); border-color: var(--gray-300); }
        .btn-outline:hover { border-color: var(--gray-600); }
        .btn-danger { background: #fff; color: var(--red); border-color: var(--gray-300); }
        .btn-danger:hover { background: var(--red-bg); border-color: var(--red); }
        .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
        .btn-block { width: 100%; height: 44px; font-size: 14px; }

        .actions { display: flex; gap: 6px; align-items: center; }
        form.inline { display: inline; margin: 0; }

        .chip {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600; line-height: 1.6; white-space: nowrap;
            background: var(--gray-100); color: var(--gray-600);
        }
        .chip-green { background: var(--green-bg); color: var(--green); }

        .field { margin-bottom: 20px; }
        .field label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--gray-800); }
        input[type=text], input[type=password], textarea, select {
            width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: 8px;
            font: inherit; color: var(--gray-800); background: #fff; outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--gray-600); }
        input.invalid, textarea.invalid { border-color: var(--red); }
        textarea { min-height: 200px; resize: vertical; }
        select { width: auto; padding: 6px 10px; font-size: 13px; }
        .error { display: block; margin-top: 6px; color: var(--red); font-size: 12px; }
        .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

        .alert { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .alert-error { background: var(--red-bg); color: var(--red); }
        .alert-info { background: var(--green-bg); color: var(--green); }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; }
        .pagination .current { font-weight: 600; color: var(--gray-800); }
    </style>
</head>
<body>
<header class="header" th:fragment="nav(active)">
    <div class="header-inner">
        <a class="brand" th:href="@{/admin}"><span>Togedy</span> Admin</a>
        <nav class="menu">
            <a th:href="@{/admin/notices}" th:classappend="${active == 'notice'} ? 'active'">앱 공지사항</a>
            <a th:href="@{/admin/calendar-announcements}"
               th:classappend="${active == 'calendar'} ? 'active'">캘린더 공지</a>
            <a th:href="@{/admin/inquiries}" th:classappend="${active == 'inquiry'} ? 'active'">문의</a>
        </nav>
        <div class="account">
            <span sec:authentication="name"></span>
            <form class="inline" th:action="@{/admin/logout}" method="post">
                <button class="btn btn-outline btn-sm" type="submit">로그아웃</button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
