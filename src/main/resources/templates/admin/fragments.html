<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Togedy Admin'">Togedy Admin</title>
    <style>
        body { font-family: sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; color: #222; }
        nav { display: flex; gap: 16px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #ddd; margin-bottom: 16px; }
        nav .spacer { flex: 1; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; vertical-align: top; }
        input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 6px; }
        textarea { min-height: 160px; }
        .error { color: #c00; font-size: 0.9em; }
        .actions { display: flex; gap: 8px; }
        form.inline { display: inline; }
        .content { white-space: pre-wrap; }
    </style>
</head>
<body>
<nav th:fragment="nav">
    <a th:href="@{/admin}">홈</a>
    <a th:href="@{/admin/notices}">앱 공지사항</a>
    <a th:href="@{/admin/calendar-announcements}">캘린더 공지</a>
    <a th:href="@{/admin/inquiries}">문의</a>
    <span class="spacer"></span>
    <span sec:authentication="name"></span>
    <form class="inline" th:action="@{/admin/logout}" method="post">
        <button type="submit">로그아웃</button>
    </form>
</nav>
</body>
</html>
