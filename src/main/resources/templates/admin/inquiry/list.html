<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('문의')}"></head>
<body>
<header th:replace="~{admin/fragments :: nav('inquiry')}"></header>
<main>
    <div class="page-head">
        <h1>문의</h1>
    </div>
    <div class="card">
        <table>
            <thead>
            <tr><th>ID</th><th>유저 ID</th><th>유형</th><th>내용</th><th>회신 이메일</th><th>등록일시</th><th>상태</th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(result.inquiries)}"><td class="empty" colspan="7">문의가 없습니다.</td></tr>
            <tr th:each="inquiry : ${result.inquiries}">
                <td class="muted" th:text="${inquiry.inquiryId}"></td>
                <td class="muted" th:text="${inquiry.userId}"></td>
                <td><span class="chip" th:text="${inquiry.inquiryType.description}"></span></td>
                <td class="content" th:text="${inquiry.inquiryContent}"></td>
                <td class="muted" th:text="${inquiry.replyEmail}"></td>
                <td class="muted" th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <form class="actions" th:action="@{/admin/inquiries/{id}/status(id=${inquiry.inquiryId})}"
                          method="post">
                        <input type="hidden" name="page" th:value="${page}">
                        <select name="status">
                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status.description}"
                                    th:selected="${status.description == inquiry.inquiryStatus}"></option>
                        </select>
                        <button class="btn btn-outline btn-sm" type="submit">변경</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="pagination">
        <a class="btn btn-outline btn-sm" th:if="${page > 1}" th:href="@{/admin/inquiries(page=${page - 1})}">이전</a>
        <span class="current" th:text="${page}"></span>
        <a class="btn btn-outline btn-sm" th:if="${result.hasNext}" th:href="@{/admin/inquiries(page=${page + 1})}">다음</a>
    </div>
</main>
</body>
</html>
