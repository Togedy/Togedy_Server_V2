<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('로그인')}"></head>
<body>
<h1>Togedy Admin</h1>
<p class="error" th:if="${param.error}">로그인 정보가 올바르지 않습니다.</p>
<p th:if="${param.logout}">로그아웃되었습니다.</p>
<form th:action="@{/admin/login}" method="post">
    <p><label>아이디 <input type="text" name="loginId" required></label></p>
    <p><label>비밀번호 <input type="password" name="password" required></label></p>
    <button type="submit">로그인</button>
</form>
</body>
</html>
