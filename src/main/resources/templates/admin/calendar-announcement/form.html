<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${calendarAnnouncementId} == null ? '캘린더 공지 작성' : '캘린더 공지 수정')}"></head>
<body>
<header th:replace="~{admin/fragments :: nav('calendar')}"></header>
<main>
    <div class="page-head">
        <h1 th:text="${calendarAnnouncementId} == null ? '캘린더 공지 작성' : '캘린더 공지 수정'"></h1>
    </div>
    <form class="card pad" th:object="${form}" method="post"
          th:action="${calendarAnnouncementId} == null ? @{/admin/calendar-announcements} : @{/admin/calendar-announcements/{id}/edit(id=${calendarAnnouncementId})}">
        <div class="field">
            <label for="content">내용</label>
            <textarea th:field="*{content}" th:errorclass="invalid" style="min-height: 120px;"></textarea>
            <span class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
        </div>
        <div class="form-actions">
            <a class="btn btn-secondary" th:href="@{/admin/calendar-announcements}">목록</a>
            <button class="btn btn-primary" type="submit">저장</button>
        </div>
    </form>
</main>
</body>
</html>
