name: CD to AWS EC2

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_KEY }}
          script: |
            export SPRING_PROFILES_ACTIVE='dev'

            export DEV_MYSQL_HOST='${{ secrets.DEV_MYSQL_HOST }}'
            export DEV_MYSQL_USER='${{ secrets.DEV_MYSQL_USER }}'
            export DEV_MYSQL_PASSWORD='${{ secrets.DEV_MYSQL_PASSWORD }}'
            export DEV_MONGODB_URI='${{ secrets.DEV_MONGODB_URI }}'
            export DEV_S3_ACCESS_KEY='${{ secrets.DEV_S3_ACCESS_KEY }}'
            export DEV_S3_SECRET_KEY='${{ secrets.DEV_S3_SECRET_KEY }}'
            export DEV_S3_BUCKET_NAME='${{ secrets.DEV_S3_BUCKET_NAME }}'
            export DEV_SWAGGER_URL='${{ secrets.DEV_SWAGGER_URL }}'
            export DEV_KAKAO_ADMIN_KEY='${{ secrets.DEV_KAKAO_ADMIN_KEY }}'

            export DEV_JWT_SECRET_KEY='${{ secrets.DEV_JWT_SECRET_KEY }}'
            export AI_SERVER_URL='${{ secrets.AI_SERVER_URL }}'
            export REDIS_HOST='${{ secrets.REDIS_HOST }}'
            export REDIS_PORT='${{ secrets.REDIS_PORT }}'
            export REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}'

            export MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'
            export MYSQL_DATABASE='${{ secrets.MYSQL_DATABASE }}'

            cd "${{ secrets.DEV_PROJECT_PATH }}/infra/script"
            export GRAFANA_ADMIN_PASSWORD='unused-in-dev'

            chmod +x deploy.sh
            ./deploy.sh develop

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Prod via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_KEY }}
          script: |
            export SPRING_PROFILES_ACTIVE='prod'

            export PROD_MYSQL_HOST='${{ secrets.PROD_MYSQL_HOST }}'
            export PROD_MYSQL_USER='${{ secrets.PROD_MYSQL_USER }}'
            export PROD_MYSQL_PASSWORD='${{ secrets.PROD_MYSQL_PASSWORD }}'
            export PROD_MONGODB_URI='${{ secrets.PROD_MONGODB_URI }}'
            export PROD_S3_ACCESS_KEY='${{ secrets.PROD_S3_ACCESS_KEY }}'
            export PROD_S3_SECRET_KEY='${{ secrets.PROD_S3_SECRET_KEY }}'
            export PROD_S3_BUCKET_NAME='${{ secrets.PROD_S3_BUCKET_NAME }}'
            export PROD_SWAGGER_URL='${{ secrets.PROD_SWAGGER_URL }}'
            export PROD_KAKAO_ADMIN_KEY='${{ secrets.PROD_KAKAO_ADMIN_KEY }}'

            export PROD_JWT_SECRET_KEY='${{ secrets.PROD_JWT_SECRET_KEY }}'
            export AI_SERVER_URL='${{ secrets.AI_SERVER_URL }}'
            export REDIS_HOST='${{ secrets.REDIS_HOST }}'
            export REDIS_PORT='${{ secrets.REDIS_PORT }}'
            export REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}'

            export GRAFANA_ADMIN_PASSWORD='${{ secrets.GRAFANA_ADMIN_PASSWORD }}'

            cd "${{ secrets.PROD_PROJECT_PATH }}/infra/script"
            chmod +x deploy.sh
            ./deploy.sh main monitoring
